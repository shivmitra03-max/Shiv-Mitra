<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShivMitra.in — Official Details & Download</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; color: #0f172a; line-height: 1.6; }

        .header {
            background: #ffffff; padding: 8px 16px; border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand-logo-img { height: 46px; width: auto; max-width: 230px; object-fit: contain; display: block; }
        .back-btn {
            background: #eff6ff; color: #1e3a8a; text-decoration: none;
            padding: 7px 14px; border-radius: 7px; font-weight: 700; font-size: 0.82rem;
        }

        .container { max-width: 880px; margin: 20px auto; padding: 0 14px; }
        .ad-slot {
            min-height: 90px; background: #e2e8f0; border-radius: 8px;
            margin: 16px 0; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .article-card {
            background: white; border-radius: 14px; border: 1px solid #e2e8f0;
            padding: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.04);
        }
        .meta-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .badge-cat { background: #1e3a8a; color: white; padding: 4px 11px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .badge-date { color: #64748b; font-size: 0.8rem; font-weight: 600; }

        h1.post-title { font-size: 1.45rem; font-weight: 800; color: #0f172a; line-height: 1.35; margin-bottom: 16px; }
        .feature-img { width: 100%; max-height: 360px; object-fit: cover; border-radius: 10px; margin-bottom: 18px; border: 1px solid #e2e8f0; }

        /* Legal Format Offer Box */
        .legal-offer-box {
            background: #fffbeb; border: 2px solid #f59e0b; border-radius: 12px;
            padding: 18px; margin-bottom: 20px;
        }
        .legal-price-row { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 14px; }
        .offer-now { font-size: 1.8rem; font-weight: 800; color: #059669; }
        .offer-old { font-size: 1.1rem; color: #94a3b8; text-decoration: line-through; }
        .offer-pct { background: #dc2626; color: white; padding: 3px 9px; border-radius: 5px; font-size: 0.78rem; font-weight: 800; }

        .article-body h3 { color: #1e3a8a; font-size: 1.1rem; margin: 20px 0 10px; border-left: 4px solid #2563eb; padding-left: 10px; }
        .article-body p { margin-bottom: 12px; color: #334155; font-size: 0.94rem; }
        .article-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.88rem; }
        .article-body th, .article-body td { border: 1px solid #cbd5e1; padding: 10px 12px; text-align: left; }
        .article-body th { background: #f8fafc; color: #0f172a; font-weight: 700; }
        .note-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 12px 15px; border-radius: 6px; margin: 14px 0; font-size: 0.9rem; }
        .inline-media img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
        .video-embed { position: relative; padding-bottom: 56.25%; height: 0; margin: 16px 0; }
        .video-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; border: none; }

        /* Official Links Box */
        .action-links-box {
            margin-top: 24px; background: #f8fafc; border: 1.5px solid #cbd5e1;
            border-radius: 12px; padding: 18px;
        }
        .action-links-box h3 { color: #0f172a; font-size: 1rem; margin-bottom: 12px; }
        .link-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 14px; background: white; border: 1px solid #e2e8f0;
            border-radius: 8px; margin-bottom: 9px; gap: 10px;
        }
        .btn-action {
            background: #059669; color: white; text-decoration: none; padding: 8px 16px;
            border-radius: 6px; font-weight: 700; font-size: 0.82rem; white-space: nowrap; border: none; cursor: pointer;
        }
        .btn-action.blue { background: #1e3a8a; }
        .btn-action.amber { background: #d97706; }

        footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 20px; margin-top: 36px; font-size: 0.8rem; }
        @media (max-width: 600px) {
            .article-card { padding: 16px; }
            h1.post-title { font-size: 1.2rem; }
            .link-row { flex-direction: column; align-items: flex-start; }
            .btn-action { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html"><img src="logo.png" alt="ShivMitra.in - Shiv Online Centre" class="brand-logo-img"></a>
        <a href="index.html" class="back-btn">&#8592; Back to Home</a>
    </header>

    <div class="container">
        <div id="adHeaderSlot" class="ad-slot" style="display:none;"></div>

        <div class="article-card" id="postContainer">
            <p style="color:#64748b;">Loading official details...</p>
        </div>

        <div id="adFooterSlot" class="ad-slot" style="display:none;"></div>
    </div>

    <footer>&copy; 2026 Shiv Online Centre (ShivMitra.in). All Rights Reserved.</footer>

    <script>
        let currentPost = null;

        (function trackVisit() {
            const logs = JSON.parse(localStorage.getItem('shiv_traffic_logs') || '[]');
            logs.push(Date.now());
            if (logs.length > 5000) logs.splice(0, logs.length - 5000);
            localStorage.setItem('shiv_traffic_logs', JSON.stringify(logs));
        })();

        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            await loadAds();
            if (!postId) {
                document.getElementById('postContainer').innerHTML = `<p style="color:#dc2626;">Post not found.</p>`;
                return;
            }
            await loadPostDetails(postId);
        };

        async function loadAds() {
            try {
                const res = await fetch(`ads.json?t=${Date.now()}`);
                if (!res.ok) return;
                const ads = await res.json();
                if (ads.headerAd) { const h = document.getElementById('adHeaderSlot'); h.style.display = 'flex'; h.innerHTML = ads.headerAd; }
                if (ads.sidebarAd) { const f = document.getElementById('adFooterSlot'); f.style.display = 'flex'; f.innerHTML = ads.sidebarAd; }
            } catch (e) {}
        }

        function downloadLegalBundleFile(idx) {
            if (!currentPost || !currentPost.legalFiles || !currentPost.legalFiles[idx]) return;
            const file = currentPost.legalFiles[idx];
            const a = document.createElement('a');
            a.href = file.dataUrl;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function loadPostDetails(postId) {
            try {
                const res = await fetch(`posts.json?t=${Date.now()}`);
                const posts = await res.json();
                currentPost = (posts || []).find(p => String(p.id) === String(postId));

                if (!currentPost) {
                    document.getElementById('postContainer').innerHTML = `<p style="color:#dc2626;">This post may have been removed.</p>`;
                    return;
                }

                document.title = `${currentPost.title} — ShivMitra.in`;
                const isLegal = currentPost.mainCat === 'Legal Format' || currentPost.mainCat === 'Legal Paid Format';
                const bannerHtml = currentPost.bannerImg ? `<img src="${currentPost.bannerImg}" class="feature-img" alt="${currentPost.title}">` : "";

                let legalBoxHtml = "";
                if (isLegal && currentPost.price) {
                    const filesBtns = (currentPost.legalFiles || []).map((f, i) => `
                        <button type="button" class="btn-action amber" style="margin:4px 6px 4px 0;" onclick="downloadLegalBundleFile(${i})">
                            &#11015; Download ${f.name} (${f.size})
                        </button>`).join('');

                    const extBtn = (currentPost.actionLink && currentPost.actionLink !== "#buy-legal-format")
                        ? `<a href="${currentPost.actionLink}" target="_blank" class="btn-action">Get Instant Format Pack &#8594;</a>` : "";

                    legalBoxHtml = `
                        <div class="legal-offer-box">
                            <span class="offer-pct">${currentPost.discountPercent > 0 ? currentPost.discountPercent + '% OFF • ' : ''}${currentPost.offerTag || 'SPECIAL OFFER'}</span>
                            <div class="legal-price-row">
                                <span class="offer-now">₹${currentPost.price}</span>
                                ${currentPost.originalPrice && Number(currentPost.originalPrice) > Number(currentPost.price) ? `<span class="offer-old">₹${currentPost.originalPrice}</span>` : ''}
                            </div>
                            <div>${filesBtns} ${extBtn}</div>
                        </div>`;
                }

                let linksSection = "";
                if (!isLegal) {
                    const isCL = currentPost.mainCat === 'Call Letter';
                    linksSection = `
                        <div class="action-links-box">
                            <h3>Important Direct Official Links</h3>
                            ${currentPost.actionLink ? `<div class="link-row"><strong>${isCL ? 'Download Call Letter / Admit Card' : 'Apply Online / Direct Portal'}</strong><a href="${currentPost.actionLink}" target="_blank" class="btn-action">Click Here &#8594;</a></div>` : ''}
                            ${currentPost.pdfLink ? `<div class="link-row"><strong>Official Notification / Notice PDF</strong><a href="${currentPost.pdfLink}" target="_blank" class="btn-action blue">View / Download PDF &#8594;</a></div>` : ''}
                            ${currentPost.officialSite ? `<div class="link-row"><strong>Official Website Homepage</strong><a href="${currentPost.officialSite}" target="_blank" class="btn-action amber">Visit Website &#8594;</a></div>` : ''}
                        </div>`;
                }

                document.getElementById('postContainer').innerHTML = `
                    <div class="meta-bar">
                        <span class="badge-cat">${currentPost.subCat || currentPost.mainCat}</span>
                        <span class="badge-date">Updated: ${currentPost.date || '2026'}</span>
                    </div>
                    <h1 class="post-title">${currentPost.title}</h1>
                    ${bannerHtml}
                    ${legalBoxHtml}
                    <div class="article-body">${currentPost.content || ''}</div>
                    ${linksSection}
                `;
            } catch (e) {
                document.getElementById('postContainer').innerHTML = `<p style="color:#dc2626;">Error loading content.</p>`;
            }
        }
    </script>
</body>
</html>
