name: Auto Fetch Jobs & Call Letters

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch Jobs and Call Letters
        run: |
          python -c "
          import json, time, feedparser

          try:
              with open('posts.json', 'r', encoding='utf-8') as f:
                  posts = json.load(f)
              if not isinstance(posts, list):
                  posts = []
          except Exception:
              posts = []

          existing_titles = {p.get('title', '').strip().lower() for p in posts}

          def get_official_portal(title_lower):
              if any(k in title_lower for k in ['ojas', 'gsssb', 'lrd', 'lokrakshak', 'psi', 'talati', 'police']):
                  return 'https://ojas.gujarat.gov.in/'
              if 'gpsc' in title_lower:
                  return 'https://gpsc-ojas.gujarat.gov.in/'
              if 'gsrtc' in title_lower:
                  return 'https://gsrtc.in/'
              if 'ibps' in title_lower:
                  return 'https://www.ibps.in/'
              if 'sbi' in title_lower:
                  return 'https://sbi.co.in/web/careers'
              if 'rbi' in title_lower:
                  return 'https://opportunities.rbi.org.in/'
              if 'ssc' in title_lower:
                  return 'https://ssc.gov.in/'
              if any(k in title_lower for k in ['rrb', 'railway']):
                  return 'https://www.rrbapply.gov.in/'
              if 'upsc' in title_lower:
                  return 'https://upsc.gov.in/'
              if 'gujarat' in title_lower:
                  return 'https://ojas.gujarat.gov.in/'
              return 'https://www.ncs.gov.in/'

          feeds = [
              {
                  'url': 'https://news.google.com/rss/search?q=OJAS+OR+GPSC+OR+GSSSB+OR+Gujarat+Recruitment+Bharti&hl=en-IN&gl=IN&ceid=IN:en',
                  'cat': 'Jobs',
                  'sub': 'Sarkari Jobs'
              },
              {
                  'url': 'https://news.google.com/rss/search?q=SSC+OR+IBPS+OR+RRB+Railway+Bank+Recruitment+2026&hl=en-IN&gl=IN&ceid=IN:en',
                  'cat': 'Jobs',
                  'sub': 'Bank Jobs'
              },
              {
                  'url': 'https://news.google.com/rss/search?q=OJAS+OR+GPSC+OR+SSC+OR+IBPS+Admit+Card+OR+Call+Letter&hl=en-IN&gl=IN&ceid=IN:en',
                  'cat': 'Call Letter',
                  'sub': 'Central & Bank Admit Card'
              }
          ]

          added = 0
          for feed_info in feeds:
              parsed = feedparser.parse(feed_info['url'])
              for entry in parsed.entries[:5]:
                  title = entry.title.split(' - ')[0].strip()
                  if not title or title.lower() in existing_titles:
                      continue

                  lower_t = title.lower()
                  is_gujarat = any(k in lower_t for k in ['gujarat', 'ojas', 'gpsc', 'gsssb', 'gsrtc', 'talati', 'lrd', 'lokrakshak', 'psi', 'ahmedabad', 'surat', 'vadodara', 'rajkot'])
                  is_bank = any(k in lower_t for k in ['bank', 'ibps', 'sbi', 'rbi', 'nabard'])

                  main_cat = feed_info['cat']
                  if main_cat == 'Call Letter':
                      sub_cat = 'Gujarat Call Letter (OJAS/GPSC)' if is_gujarat else 'Central & Bank Admit Card'
                  else:
                      sub_cat = 'Bank Jobs' if is_bank else 'Sarkari Jobs'

                  official_url = get_official_portal(lower_t)

                  posts.insert(0, {
                      'id': int(time.time() * 1000) + added,
                      'mainCat': main_cat,
                      'subCat': sub_cat,
                      'title': title,
                      'date': time.strftime('%d %b %Y'),
                      'actionLink': official_url,
                      'price': '',
                      'summary': f'{title} - Official notification, eligibility & direct apply/download link details.',
                      'content': f'<p>Official update released for <strong>{title}</strong>. Click Edit & Add Banner/Table to format before publishing.</p>',
                      'bannerImg': '',
                      'status': 'draft'
                  })
                  existing_titles.add(title.lower())
                  added += 1

          with open('posts.json', 'w', encoding='utf-8') as f:
              json.dump(posts, f, indent=2, ensure_ascii=False)
          print(f'Successfully added {added} new drafts with official links.')
          "

      - name: Commit and push drafts
        run: |
          git config user.name "ShivMitra AutoBot"
          git config user.email "bot@shivmitra.in"
          git add posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-fetch new jobs & call letters" && git push)